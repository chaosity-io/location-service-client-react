name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      # Lint was checked nowhere — not here, not in the old pre-push hook — so
      # formatting drifted unnoticed until the rewritten hook caught it.
      - run: npm run lint

      - run: npm test

      - run: npm run build

      # A green build is not a loadable package: 0.4.0 passed every step here
      # and still threw ERR_MODULE_NOT_FOUND on `import` outside a bundler
      # (#16). This resolves dist/ through Node itself, as ESM and as CJS.
      - run: npm run smoke

      - run: npm pack
